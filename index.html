<script>
(function () {
  'use strict';

  // ===== 共享常量（与 workerCode 内的定义保持一致） =====
  const SIZE = 13;
  const DPR_MAX = 3;
  const BLACK = 1;
  const WHITE = -1;
  const WIN_THRESHOLD = 5000000;

  const DIFFICULTIES = Object.freeze({
    fast: { label: '浅', timeBudgetMs: 300, nodeBudget: 80000 },
    standard: { label: '标准', timeBudgetMs: 1000, nodeBudget: 200000 },
    deep: { label: '深', timeBudgetMs: 2500, nodeBudget: 400000 }
  });

  const state = {
    board: new Int8Array(SIZE * SIZE),
    turn: BLACK,
    humanSide: BLACK,
    history: [],
    lastMove: null,
    winner: 0,
    gameOver: false,
    difficulty: 'standard',
    requestId: 0,
    analyzing: false,
    result: null,
    degraded: false,
    hoverIdx: -1,
    lastPayload: null,
    autoOpponent: false,
    hintsVisible: true,
    catchup: null,
    catchupSeq: 0,
    interruptContext: null
  };

  const canvas = document.getElementById('boardCanvas');
  const ctx = canvas.getContext('2d');
  const el = {
    statusText: document.getElementById('statusText'),
    statusDot: document.getElementById('statusDot'),
    lossText: document.getElementById('lossText'),
    calcBadge: document.getElementById('calcBadge'),
    degradedBadge: document.getElementById('degradedBadge'),
    turnChip: document.getElementById('turnChip'),
    moveCount: document.getElementById('moveCount'),
    ruleNote: document.getElementById('ruleNote'),
    sideGroup: document.getElementById('sideGroup'),
    difficultyGroup: document.getElementById('difficultyGroup'),
    autoOpponentBtn: document.getElementById('autoOpponentBtn'),
    autoOpponentLabel: document.getElementById('autoOpponentLabel'),
    hintsBtn: document.getElementById('hintsBtn'),
    hintsLabel: document.getElementById('hintsLabel'),
    scoreChart: document.getElementById('scoreChart'),
    scoreChartHint: document.getElementById('scoreChartHint'),
    undoBtn: document.getElementById('undoBtn'),
    restartBtn: document.getElementById('restartBtn')
  };

  const WORKER_SOURCE = document.getElementById('workerCode').textContent;
  let worker = null;
  let workerUrl = null;
  let fallbackEngine = null;
  let fallbackBroken = false;
  let autoMoveTimer = 0;

  let boardCss = 0;
  let cellSize = 0;
  let boardPad = 0;
  let stoneRadius = 0;

  function idxOf(x, y) {
    return y * SIZE + x;
  }

  function otherSide(side) {
    return side === BLACK ? WHITE : BLACK;
  }

  function sideName(side) {
    return side === BLACK ? '黑' : '白';
  }

  function formatInt(n) {
    if (!isFinite(n)) return '—';
    return Math.round(n).toLocaleString('zh-CN');
  }

  function formatScore(n) {
    if (!isFinite(n)) return '—';
    if (n >= WIN_THRESHOLD) return 'WIN';
    if (n <= -WIN_THRESHOLD) return 'LOSS';
    return formatInt(n);
  }

  // ===== Canvas / DPR =====
  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const css = Math.floor(Math.min(rect.width, rect.height || rect.width));
    if (css < 80) return;
    boardCss = css;
    const dpr = Math.max(1, Math.min(DPR_MAX, window.devicePixelRatio || 1));
    canvas.width = Math.round(css * dpr);
    canvas.height = Math.round(css * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    boardPad = css * 0.075;
    cellSize = (css - boardPad * 2) / (SIZE - 1);
    stoneRadius = cellSize * 0.41;
    drawBoard();
  }

  function gridPos(i) {
    return boardPad + i * cellSize;
  }

  function isOnBoard(x, y) {
    return x >= 0 && x < SIZE && y >= 0 && y < SIZE;
  }

  function drawBoard() {
    if (!boardCss) return;
    const size = boardCss;
    ctx.clearRect(0, 0, size, size);

    // 棋盘底
    const bg = ctx.createRadialGradient(size * 0.32, size * 0.22, 0, size * 0.52, size * 0.55, size * 0.88);
    bg.addColorStop(0, '#1b2534');
    bg.addColorStop(0.58, '#141c28');
    bg.addColorStop(1, '#0e141d');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, size, size);

    // 内边框
    ctx.strokeStyle = 'rgba(154, 181, 218, 0.09)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, size - 1, size - 1);

    // 网格
    for (let i = 0; i < SIZE; i++) {
      const p = gridPos(i);
      const outer = i === 0 || i === SIZE - 1;
      ctx.beginPath();
      ctx.strokeStyle = outer ? 'rgba(164, 190, 225, 0.28)' : 'rgba(148, 174, 208, 0.18)';
      ctx.lineWidth = outer ? 1.25 : 0.8;
      ctx.moveTo(p, boardPad);
      ctx.lineTo(p, size - boardPad);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(boardPad, p);
      ctx.lineTo(size - boardPad, p);
      ctx.stroke();
    }

    // 星位
    drawStar(3, 3);
    drawStar(3, 9);
    drawStar(9, 3);
    drawStar(9, 9);
    drawStar(6, 6);

    // 热力图在棋子下方（提示关闭时不绘制）
    if (state.hintsVisible) drawHeatmap();

    // 棋子
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const v = state.board[idxOf(x, y)];
        if (v === 0) continue;
        drawStone(x, y, v);
      }
    }

    // 最后一手红点
    if (state.lastMove) {
      const cx = gridPos(state.lastMove.x);
      const cy = gridPos(state.lastMove.y);
      ctx.save();
      ctx.fillStyle = '#ff4f5e';
      ctx.shadowColor = 'rgba(255, 79, 94, 0.58)';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // AI 推荐点金色虚线圈（提示关闭时不绘制）
    if (state.hintsVisible) drawRecommendation();

    // 鼠标悬停预览
    if (!state.gameOver && state.hoverIdx >= 0 && state.board[state.hoverIdx] === 0) {
      const hx = state.hoverIdx % SIZE;
      const hy = (state.hoverIdx / SIZE) | 0;
      ctx.save();
      ctx.globalAlpha = 0.3;
      drawStone(hx, hy, state.turn);
      ctx.restore();
    }
  }

  function drawStar(x, y) {
    ctx.save();
    ctx.fillStyle = 'rgba(176, 199, 229, 0.62)';
    ctx.beginPath();
    ctx.arc(gridPos(x), gridPos(y), Math.max(2.2, cellSize * 0.065), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStone(x, y, side, alpha) {
    const cx = gridPos(x);
    const cy = gridPos(y);
    const r = stoneRadius;
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
    ctx.shadowBlur = Math.max(3, r * 0.4);
    ctx.shadowOffsetY = Math.max(1, r * 0.16);
    const g = ctx.createRadialGradient(cx - r * 0.32, cy - r * 0.38, r * 0.08, cx, cy, r * 1.05);
    if (side === BLACK) {
      g.addColorStop(0, '#505050');
      g.addColorStop(0.42, '#252527');
      g.addColorStop(1, '#000000');
    } else {
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.5, '#eef1f4');
      g.addColorStop(1, '#b9bec8');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = side === BLACK ? 'rgba(255, 255, 255, 0.12)' : 'rgba(0, 0, 0, 0.18)';
    ctx.beginPath();
    ctx.arc(cx, cy, r - 0.4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawHeatmap() {
    if (!state.result || !Array.isArray(state.result.top15)) return;
    const top15 = state.result.top15;
    const ordinary = [];
    for (let i = 0; i < top15.length; i++) {
      if (!top15[i].isWin) ordinary.push(top15[i].score);
    }
    let min = 0;
    let max = 1;
    if (ordinary.length > 0) {
      min = Math.min.apply(null, ordinary);
      max = Math.max.apply(null, ordinary);
    }

    for (let i = 0; i < top15.length; i++) {
      const move = top15[i];
      if (!move || !isOnBoard(move.x, move.y)) continue;
      if (state.board[idxOf(move.x, move.y)] !== 0) continue;
      const cx = gridPos(move.x);
      const cy = gridPos(move.y);
      if (move.isWin || move.score >= WIN_THRESHOLD) {
        const tag = move.tag === 'VCF' ? 'VCF' : (move.tag === 'VCT' ? 'VCT' : 'WIN');
        const radius = cellSize * 0.48;
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        grad.addColorStop(0, 'rgba(255, 60, 82, 0.5)');
        grad.addColorStop(0.7, 'rgba(238, 44, 69, 0.27)');
        grad.addColorStop(1, 'rgba(255, 60, 82, 0)');
        ctx.save();
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 111, 125, 0.8)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.72, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#ffd5da';
        ctx.font = '700 ' + Math.max(9, Math.round(cellSize * 0.22)) + 'px "Segoe UI", "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(tag, cx, cy + 0.5);
        ctx.restore();
      } else {
        const t = max > min ? (move.score - min) / (max - min) : 0.5;
        const hue = 215 + 115 * t;
        const radius = cellSize * (0.16 + 0.17 * t);
        ctx.save();
        ctx.globalAlpha = 0.25 + 0.3 * t;
        ctx.fillStyle = 'hsl(' + hue + ' 86% 62%)';
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'hsla(' + hue + ', 90%, 76%, 0.22)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();
        const label = String(Math.round(t * 99)).padStart(2, '0');
        ctx.fillStyle = 'rgba(239, 246, 255, 0.94)';
        ctx.font = '650 ' + Math.max(9, Math.round(cellSize * 0.23)) + 'px "Cascadia Code", Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 3;
        ctx.fillText(label, cx, cy + 0.5);
        ctx.restore();
      }
    }
  }

  function drawRecommendation() {
    if (state.gameOver || !state.result || !state.result.best) return;
    const best = state.result.best;
    if (!isOnBoard(best.x, best.y)) return;
    if (state.board[idxOf(best.x, best.y)] !== 0) return;
    const cx = gridPos(best.x);
    const cy = gridPos(best.y);
    const overlapsLast = !!(state.lastMove && state.lastMove.x === best.x && state.lastMove.y === best.y);
    const radius = stoneRadius + (overlapsLast ? Math.max(9, cellSize * 0.24) : Math.max(4, cellSize * 0.1));
    ctx.save();
    ctx.strokeStyle = '#f6c453';
    ctx.lineWidth = Math.max(1.8, cellSize * 0.045);
    ctx.setLineDash([4, 4]);
    ctx.lineDashOffset = 0;
    ctx.shadowColor = 'rgba(246, 196, 83, 0.72)';
    ctx.shadowBlur = 9;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // ===== 交互坐标 =====
  function pointFromEvent(event) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const scaleX = boardCss / rect.width;
    const scaleY = boardCss / rect.height;
    const px = (event.clientX - rect.left) * scaleX;
    const py = (event.clientY - rect.top) * scaleY;
    const x = Math.round((px - boardPad) / cellSize);
    const y = Math.round((py - boardPad) / cellSize);
    if (!isOnBoard(x, y)) return null;
    const cx = gridPos(x);
    const cy = gridPos(y);
    const dist = Math.hypot(px - cx, py - cy);
    if (dist > cellSize * 0.58) return null;
    return { x: x, y: y, idx: idxOf(x, y) };
  }

  // ===== 状态栏 =====
  function setBusyUi(busy) {
    el.statusDot.classList.toggle('busy', busy);
    el.calcBadge.hidden = !busy;
  }

  function setStatus(text, lossText) {
    el.statusText.textContent = text;
    if (lossText !== undefined) el.lossText.textContent = lossText;
  }

  function updateUnderBoard() {
    if (state.gameOver) {
      el.turnChip.textContent = state.winner === 0 ? '和棋' : sideName(state.winner) + '方获胜';
      el.turnChip.classList.remove('white');
    } else {
      el.turnChip.textContent = '轮到' + sideName(state.turn) + '方';
      el.turnChip.classList.toggle('white', state.turn === WHITE);
    }
    el.moveCount.textContent = '第 ' + state.history.length + ' 手';
    el.ruleNote.textContent = '你执' + sideName(state.humanSide) + ' · ' + (state.autoOpponent ? '自动' : '手动');
  }

  function updateControls() {
    const sideButtons = el.sideGroup.querySelectorAll('[data-side]');
    sideButtons.forEach(function (button) {
      button.classList.toggle('active', Number(button.getAttribute('data-side')) === state.humanSide);
    });
    const diffButtons = el.difficultyGroup.querySelectorAll('[data-diff]');
    diffButtons.forEach(function (button) {
      button.classList.toggle('active', button.getAttribute('data-diff') === state.difficulty);
    });
    el.autoOpponentBtn.classList.toggle('active', state.autoOpponent);
    el.autoOpponentBtn.setAttribute('aria-pressed', state.autoOpponent ? 'true' : 'false');
    el.autoOpponentLabel.textContent = '自动对手：' + (state.autoOpponent ? '开' : '关');
    el.hintsBtn.classList.toggle('active', state.hintsVisible);
    el.hintsBtn.setAttribute('aria-pressed', state.hintsVisible ? 'true' : 'false');
    el.hintsLabel.textContent = '提示：' + (state.hintsVisible ? '开' : '关');
  }

  // ===== Worker / 降级 =====
  function createWorker() {
    if (typeof Worker !== 'function') throw new Error('浏览器不支持 Worker');
    if (!workerUrl) {
      const blob = new Blob([WORKER_SOURCE], { type: 'application/javascript' });
      workerUrl = URL.createObjectURL(blob);
    }
    const w = new Worker(workerUrl);
    w.addEventListener('message', function (event) {
      if (worker === w) handleEngineMessage(event.data);
    });
    w.addEventListener('error', function (event) {
      if (worker === w) onWorkerError(event);
    });
    return w;
  }

  function ensureWorker() {
    if (worker) return true;
    if (state.degraded) return false;
    try {
      worker = createWorker();
      return true;
    } catch (err) {
      activateFallback(err);
      return false;
    }
  }

  function initEngine() {
    ensureWorker();
  }

  // 用户在新搜索期间落子时，硬终止旧 Worker 并立即重建；
  // 这比“旧搜索跑完再处理新请求”响应更快，旧结果仍由 requestId 兜底。
  function interruptWorker() {
    if (!worker || state.degraded) return;
    try { worker.terminate(); } catch (err) { /* 忽略终止异常 */ }
    worker = null;
    ensureWorker();
  }

  function activateFallback(reason) {
    if (state.degraded) return;
    if (worker) {
      try { worker.terminate(); } catch (err) { /* 忽略终止异常 */ }
      worker = null;
    }
    if (workerUrl) {
      try { URL.revokeObjectURL(workerUrl); } catch (err) { /* 忽略 */ }
      workerUrl = null;
    }
    try {
      const fakeSelf = { postMessage: handleEngineMessage };
      const factory = new Function('self', WORKER_SOURCE + '\nreturn self.__GOMOKU_ENGINE__;');
      const engine = factory(fakeSelf);
      if (!engine || typeof engine.analyzeMessage !== 'function') throw new Error('降级引擎创建失败');
      fallbackEngine = engine;
      state.degraded = true;
      el.degradedBadge.hidden = false;
    } catch (err) {
      fallbackBroken = true;
      state.analyzing = false;
      setBusyUi(false);
      setStatus(
        '无法初始化分析引擎', 'Blob Worker 与主线程降级均失败');
      console.error('Gomoku engine fallback failed:', reason, err);
    }
  }

  function onWorkerError(event) {
    if (event && typeof event.preventDefault === 'function') event.preventDefault();
    console.error('Gomoku Worker error:', event && event.message ? event.message : event);
    handleEngineError(state.lastPayload ? state.lastPayload.requestId : state.requestId, new Error('Worker 运行失败'));
  }

  function handleEngineError(requestId, err) {
    state.catchup = null;
    if (requestId !== state.requestId) return;
    if (!state.degraded && !fallbackBroken) {
      activateFallback(err);
      if (state.degraded && state.lastPayload && state.lastPayload.requestId === state.requestId) {
        runFallback(state.lastPayload);
        return;
      }
    }
    state.analyzing = false;
    setBusyUi(false);
    setStatus(
      '分析失败，请重新落子或刷新页面', '主线程降级引擎不可用');
  }

  function runFallback(payload) {
    if (!fallbackEngine || fallbackBroken) {
      handleEngineError(payload.requestId, new Error('降级引擎不可用'));
      return;
    }
    const id = payload.requestId;
    requestAnimationFrame(function () {
      window.setTimeout(function () {
        if (state.requestId !== id) return;
        try {
          fallbackEngine.analyzeMessage(payload, handleEngineMessage);
        } catch (err) {
          if (err && err.name === 'SearchAbort') return;
          handleEngineError(id, err);
        }
      }, 0);
    });
  }

  function sendAnalyze(payload, isCatchup) {
    if (!isCatchup) state.lastPayload = payload;
    if (isCatchup) {
      if (state.degraded) {
        finishCatchup();
        return;
      }
      if (!worker && !ensureWorker()) {
        finishCatchup();
        return;
      }
      try {
        worker.postMessage(payload);
      } catch (err) {
        activateFallback(err);
        finishCatchup();
      }
      return;
    }
    if (state.degraded) {
      if (fallbackEngine) runFallback(payload);
      else handleEngineError(payload.requestId, new Error('降级引擎不可用'));
      return;
    }
    if (!worker && !ensureWorker()) {
      if (fallbackEngine) runFallback(payload);
      else handleEngineError(payload.requestId, new Error('分析引擎未初始化'));
      return;
    }
    try {
      worker.postMessage(payload);
    } catch (err) {
      activateFallback(err);
      runFallback(payload);
    }
  }

  function finishCatchup() {
    const current = state.catchup;
    state.catchup = null;
    if (!current || !current.pending) return;
    if (current.pending.requestId !== state.requestId) return;
    if (state.analyzing) setStatus('AI正在计算…', '分析中…');
    sendAnalyze(current.pending);
  }

  function cancelEngine() {
    clearAutoMove();
    state.catchup = null;
    state.interruptContext = null;
    state.lastPayload = null;
    if (worker) {
      try { worker.terminate(); } catch (err) { /* 忽略 */ }
      worker = null;
    }
    if (fallbackEngine) {
      try { fallbackEngine.cancelSearch(); } catch (err) { /* 忽略 */ }
    }
  }

  // ===== 自动对手 / 损失曲线 =====
  function clearAutoMove() {
    if (autoMoveTimer) {
      window.clearTimeout(autoMoveTimer);
      autoMoveTimer = 0;
    }
  }

  function canAutoPlay() {
    return state.autoOpponent && !state.gameOver && state.turn !== state.humanSide;
  }

  function scheduleAutoOpponent() {
    if (!canAutoPlay() || state.analyzing || !state.result) return;
    const best = state.result.best;
    if (!best || !isOnBoard(best.x, best.y)) return;
    if (state.board[idxOf(best.x, best.y)] !== 0) return;
    clearAutoMove();
    autoMoveTimer = window.setTimeout(function () {
      autoMoveTimer = 0;
      if (!canAutoPlay() || state.analyzing || !state.result) return;
      const point = state.result.best;
      if (!point || !isOnBoard(point.x, point.y)) return;
      if (state.board[idxOf(point.x, point.y)] !== 0) return;
      placeAt(point.x, point.y, true);
    }, 240);
  }

  function maybeAutoOpponent() {
    if (!state.autoOpponent || state.gameOver) return;
    if (state.turn === state.humanSide) return;
    if (state.analyzing) return;
    if (state.result) scheduleAutoOpponent();
    else requestAnalysis('auto');
  }

  function toggleAutoOpponent() {
    state.autoOpponent = !state.autoOpponent;
    clearAutoMove();
    updateControls();
    updateUnderBoard();
    drawBoard();
    if (!state.autoOpponent) {
      setStatus(
        '自动对手已关闭', '双方手动');
      return;
    }
    if (state.gameOver) {
      setStatus('自动对手已开启', '重开后生效');
      return;
    }
    if (state.turn === state.humanSide) {
      setStatus(
        '自动对手已开启', '轮到你落子');
    } else {
      setStatus(
        '自动对手已开启', '自动选择落点');
      maybeAutoOpponent();
    }
  }

  function applyHintsVisibility() {
    el.hintsBtn.classList.toggle('active', state.hintsVisible);
    el.hintsBtn.setAttribute('aria-pressed', state.hintsVisible ? 'true' : 'false');
    el.hintsLabel.textContent = '提示：' + (state.hintsVisible ? '开' : '关');
  }

  function toggleHints() {
    state.hintsVisible = !state.hintsVisible;
    applyHintsVisibility();
    drawBoard();
  }

  function qualityFromLoss(loss) {
    if (!Number.isFinite(loss)) return null;
    const q = Math.round(100 * Math.exp(-loss / 12000));
    return Math.max(0, Math.min(100, q));
  }

  function drawScoreChart() {
    const svg = el.scoreChart;
    if (!svg) return;
    const entries = [];
    let ownCount = 0;
    state.history.forEach(function (h) {
      if (h.side !== state.humanSide) return;
      ownCount += 1;
      if (Number.isFinite(h.quality)) {
        entries.push({ label: '第' + ownCount + '手', quality: h.quality });
      }
    });
    if (entries.length < 1) {
      svg.innerHTML = '';
      el.scoreChartHint.textContent = '100 = 最佳 · 仅统计你执' + sideName(state.humanSide);
      return;
    }
    const W = 300;
    const H = 56;
    const pad = 8;
    const points = entries.map(function (e, i) {
      const x = entries.length === 1 ? W / 2 : pad + (i / (entries.length - 1)) * (W - pad * 2);
      const y = H - pad - (e.quality / 100) * (H - pad * 2);
      return { x: x, y: y, quality: e.quality, label: e.label };
    });
    let worst = points[0];
    for (let i = 1; i < points.length; i++) {
      if (points[i].quality < worst.quality) worst = points[i];
    }
    let markup = '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="rgba(148,174,208,0.18)" stroke-width="1"/>';
    if (points.length >= 2) {
      markup += '<polyline points="' + points.map(function (p) {
        return p.x.toFixed(1) + ',' + p.y.toFixed(1);
      }).join(' ') + '" fill="none" stroke="#f6c453" stroke-width="1.5" opacity="0.9" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (p === worst && worst.quality < 100) {
        markup += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.2" fill="#ff5e6c"/>';
      } else {
        markup += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="1.7" fill="#f6c453" opacity="0.85"/>';
      }
    }
    if (worst.quality < 100) {
      const tx = Math.min(W - 48, Math.max(28, worst.x));
      const ty = Math.max(10, worst.y - 7);
      markup += '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffb3ba">' + worst.label + '</text>';
    }
    svg.innerHTML = markup;
    el.scoreChartHint.textContent = points.length === 1
      ? worst.label + ' · ' + worst.quality + ' 分'
      : (worst.quality < 100
        ? '最低分：' + worst.label + ' · ' + worst.quality + ' 分'
        : '全部最佳 · 100 分');
  }

  function handleEngineMessage(msg) {
    if (!msg || typeof msg.requestId !== 'number') return;
    if (state.catchup && msg.requestId === state.catchup.requestId) {
      if (msg.type === 'result' || msg.type === 'error') finishCatchup();
      else if (msg.type === 'progress' && state.analyzing) {
        el.statusText.textContent = 'AI正在计算… 补算损失…';
      }
      return;
    }
    if (msg.requestId !== state.requestId) return;

    if (msg.type === 'progress') {
      if (state.analyzing) {
        el.statusText.textContent = 'AI正在计算… 已到深度 ' + msg.depth;
      }
      return;
    }

    if (msg.type === 'error') {
      handleEngineError(msg.requestId, new Error(msg.message || '引擎错误'));
      return;
    }

    if (msg.type !== 'result') return;
    state.analyzing = false;
    state.interruptContext = null;
    state.result = {
      best: msg.best,
      top15: Array.isArray(msg.top15) ? msg.top15 : [],
      lossFromPlayer: msg.lossFromPlayer,
      meta: msg.meta || { depth: 0, nodes: 0, timeMs: 0, truncated: false }
    };
    setBusyUi(false);
    state.lastPayload = null;
    renderResult();
    updateUnderBoard();
    drawBoard();
    if (state.autoOpponent && state.turn !== state.humanSide) scheduleAutoOpponent();
  }

  function renderResult() {
    const result = state.result;
    if (!result) return;
    const best = result.best;
    let title = '暂无可推荐落点';
    if (best && isOnBoard(best.x, best.y)) {
      if (best.tag === 'VCF') {
        title = '发现必杀点 (' + best.x + ',' + best.y + ') · VCF';
      } else if (best.tag === 'VCT') {
        title = '疑似胜势 (' + best.x + ',' + best.y + ') · VCT';
      } else if (best.score <= -WIN_THRESHOLD) {
        title = '局面告急：当前行棋方有被连杀风险';
      } else if (best.isWin) {
        title = '推荐落点 (' + best.x + ',' + best.y + ')，评分 WIN';
      } else {
        title = '推荐落点 (' + best.x + ',' + best.y + ')，评分 ' + formatScore(best.score);
      }
    }
    if (state.degraded) title += ' (降级模式)';

    const lastStone = state.history.length > 0 ? state.history[state.history.length - 1] : null;
    const lastWasMine = !!(lastStone && lastStone.side === state.humanSide);
    let lossLine;
    if (result.lossFromPlayer === null || result.lossFromPlayer === undefined) {
      if (state.history.length <= 1) {
        lossLine = '首手无历史';
      } else if (lastStone && !lastWasMine) {
        lossLine = sideName(lastStone.side) + '方落子';
      } else {
        lossLine = '无新落子';
      }
    } else if (lastWasMine) {
      lossLine = '你刚才这步损失 ' + formatInt(result.lossFromPlayer) + ' 分';
    } else if (lastStone) {
      lossLine = sideName(lastStone.side) + '方上一步损失 ' + formatInt(result.lossFromPlayer) + ' 分';
    } else {
      lossLine = '上一步损失 ' + formatInt(result.lossFromPlayer) + ' 分';
    }

    if (result.lossFromPlayer !== null && result.lossFromPlayer !== undefined && lastStone) {
      lastStone.loss = result.lossFromPlayer;
      lastStone.quality = qualityFromLoss(result.lossFromPlayer);
      updateUnderBoard();
    }

    setStatus(title, lossLine);
    drawScoreChart();
  }

  // ===== 对局逻辑 =====
  function hasFive(x, y, side) {
    const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
    for (let d = 0; d < dirs.length; d++) {
      const dx = dirs[d][0];
      const dy = dirs[d][1];
      let count = 1;
      for (let sign = 1; sign >= -1; sign -= 2) {
        let nx = x + dx * sign;
        let ny = y + dy * sign;
        while (isOnBoard(nx, ny) && state.board[idxOf(nx, ny)] === side) {
          count++;
          nx += dx * sign;
          ny += dy * sign;
        }
      }
      if (count >= 5) return true;
    }
    return false;
  }

  function requestAnalysis(reason) {
    if (state.gameOver) return;
    const difficulty = DIFFICULTIES[state.difficulty];
    const wasAnalyzing = state.analyzing;
    const interruptContext = state.interruptContext;
    state.interruptContext = null;
    state.catchup = null;
    clearAutoMove();
    state.requestId += 1;
    state.analyzing = true;
    state.result = null;
    state.hoverIdx = -1;
    const payload = {
      type: 'analyze',
      requestId: state.requestId,
      board: new Int8Array(state.board),
      side: state.turn,
      timeBudgetMs: difficulty.timeBudgetMs,
      nodeBudget: difficulty.nodeBudget
    };
    state.lastPayload = payload;
    setBusyUi(true);
    let lossHint = '分析中…';
    if (reason === 'undo' || reason === 'difficulty') lossHint = '重算中…';
    else if (reason === 'auto') lossHint = '自动落子…';
    drawBoard();
    if (wasAnalyzing && !state.degraded) {
      interruptWorker();
      if (!state.degraded && interruptContext) {
        const catchupPayload = {
          type: 'analyze',
          requestId: -(++state.catchupSeq),
          board: new Int8Array(interruptContext.board),
          side: interruptContext.side,
          timeBudgetMs: 300,
          nodeBudget: 80000
        };
        state.catchup = { requestId: catchupPayload.requestId, pending: payload };
        setStatus('AI正在计算…', '补算损失…');
        sendAnalyze(catchupPayload, true);
        return;
      }
    }
    setStatus('AI正在计算…', lossHint);
    sendAnalyze(payload);
  }

  function placeAt(x, y, isAuto) {
    if (state.gameOver) return;
    const idx = idxOf(x, y);
    if (state.board[idx] !== 0) return;
    clearAutoMove();
    const side = state.turn;
    state.interruptContext = state.analyzing
      ? { board: new Int8Array(state.board), side: side }
      : null;
    state.board[idx] = side;
    state.history.push({ x: x, y: y, side: side, auto: !!isAuto });
    state.lastMove = { x: x, y: y };
    state.turn = otherSide(side);

    if (hasFive(x, y, side)) {
      state.winner = side;
      state.gameOver = true;
      state.requestId += 1;
      state.analyzing = false;
      state.result = null;
      cancelEngine();
      setBusyUi(false);
      updateUnderBoard();
      setStatus(
        sideName(side) + '方五连 · 获胜（自由规则）', '对局结束，不再计算损失');
      drawBoard();
      return;
    }

    if (state.history.length === SIZE * SIZE) {
      state.winner = 0;
      state.gameOver = true;
      state.requestId += 1;
      state.analyzing = false;
      state.result = null;
      cancelEngine();
      setBusyUi(false);
      updateUnderBoard();
      setStatus('棋盘已满 · 和棋', '对局结束，不再计算损失');
      drawBoard();
      return;
    }

    updateUnderBoard();
    drawBoard();
    requestAnalysis();
  }

  function undo() {
    if (state.history.length === 0) {
      setStatus('没有可悔的棋', '先落子再悔棋');
      return;
    }
    state.requestId += 1;
    cancelEngine();
    state.analyzing = false;
    state.result = null;
    state.gameOver = false;
    state.winner = 0;
    const last = state.history.pop();
    state.board[idxOf(last.x, last.y)] = 0;
    state.turn = last.side;
    state.lastMove = state.history.length > 0
      ? { x: state.history[state.history.length - 1].x, y: state.history[state.history.length - 1].y }
      : null;
    state.hoverIdx = -1;
    if (state.autoOpponent && state.turn !== state.humanSide) {
      state.autoOpponent = false;
      updateControls();
    }
    setBusyUi(false);
    updateUnderBoard();
    drawBoard();
    drawScoreChart();
    if (state.history.length > 0) {
      requestAnalysis('undo');
    } else {
      setStatus(
        '已悔棋', '首手无历史');
    }
  }

  function restart() {
    state.requestId += 1;
    cancelEngine();
    state.board.fill(0);
    state.history = [];
    state.lastMove = null;
    state.turn = BLACK;
    state.winner = 0;
    state.gameOver = false;
    state.analyzing = false;
    state.result = null;
    state.hoverIdx = -1;
    setBusyUi(false);
    updateUnderBoard();
    drawBoard();
    drawScoreChart();
    setStatus(
      '新对局', '首手无历史');
    maybeAutoOpponent();
  }

  function switchSide(side) {
    if (side === state.humanSide) return;
    state.humanSide = side;
    updateControls();
    state.requestId += 1;
    cancelEngine();
    state.board.fill(0);
    state.history = [];
    state.lastMove = null;
    state.turn = BLACK;
    state.winner = 0;
    state.gameOver = false;
    state.analyzing = false;
    state.result = null;
    setBusyUi(false);
    updateUnderBoard();
    drawBoard();
    drawScoreChart();
    setStatus(
      '已切换执' + sideName(side), '首手无历史');
    maybeAutoOpponent();
  }

  function switchDifficulty(diff) {
    if (!DIFFICULTIES[diff] || diff === state.difficulty) return;
    state.difficulty = diff;
    updateControls();
    if (state.history.length > 0 && !state.gameOver) {
      state.result = null;
      requestAnalysis('difficulty');
    } else {
      const difficulty = DIFFICULTIES[diff];
      setStatus(
        '思考深度：' + difficulty.label, '');
    }
  }

  // ===== 事件绑定 =====
  function bindEvents() {
    canvas.addEventListener('click', function (event) {
      const point = pointFromEvent(event);
      if (!point) return;
      if (state.gameOver) {
        el.statusText.textContent = '对局已结束 · 点击「重开」再来一局';
        return;
      }
      placeAt(point.x, point.y);
    });

    canvas.addEventListener('pointermove', function (event) {
      const point = pointFromEvent(event);
      const next = point ? point.idx : -1;
      if (next !== state.hoverIdx) {
        state.hoverIdx = next;
        drawBoard();
      }
    });

    canvas.addEventListener('pointerleave', function () {
      if (state.hoverIdx !== -1) {
        state.hoverIdx = -1;
        drawBoard();
      }
    });

    el.undoBtn.addEventListener('click', undo);
    el.restartBtn.addEventListener('click', restart);
    el.autoOpponentBtn.addEventListener('click', toggleAutoOpponent);
    el.hintsBtn.addEventListener('click', toggleHints);

    el.sideGroup.addEventListener('click', function (event) {
      const button = event.target.closest('[data-side]');
      if (!button) return;
      switchSide(Number(button.getAttribute('data-side')));
    });

    el.difficultyGroup.addEventListener('click', function (event) {
      const button = event.target.closest('[data-diff]');
      if (!button) return;
      switchDifficulty(button.getAttribute('data-diff'));
    });

    window.addEventListener('resize', resizeCanvas);
    if (typeof ResizeObserver === 'function') {
      const observer = new ResizeObserver(function () { resizeCanvas(); });
      observer.observe(canvas.parentElement);
    }
  }

  function init() {
    updateControls();
    updateUnderBoard();
    setStatus(
      '落子后开始分析', '首手无历史');
    drawScoreChart();
    bindEvents();
    initEngine();
    requestAnimationFrame(function () {
      resizeCanvas();
      if (state.degraded) {
        setStatus(
          '降级模式', '首手无历史');
      }
    });
  }

  init();
})();

</script>
</body>
</html>
